name: Create and Use File

on:
  workflow_dispatch: # Manual trigger for demo/testing
  push:
    branches:
      - "**" # Run on push to any branch
permissions:
  contents: write
  pull-requests: write
jobs:
  create-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create a file with date and time
        run: |
          FILE_NAME="myfile-$(date +%Y%m%d-%H%M%S).txt"
          echo "file_name=$FILE_NAME" >> $GITHUB_ENV
          echo "Hello from Job 1" > $FILE_NAME

      - name: Set up git
        run: |
          git config user.name "sharath.c7"
          git config user.email "38426245+sharath-c7@users.noreply.github.com"

      - name: Get current branch name
        id: get_branch
        run: echo "branch=$(echo $GITHUB_REF | sed 's/refs\/heads\///')" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create new branch, commit, and push
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git
          NEW_BRANCH="add-myfile-branch-$(date +%s)"
          echo "new_branch=$NEW_BRANCH" >> $GITHUB_ENV
          git checkout -b $NEW_BRANCH
          git add ${{ env.file_name }}
          git commit -m "Add ${{ env.file_name }}"
          git push origin $NEW_BRANCH

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        id: cpr
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: Add myfile.txt
          branch: ${{ env.new_branch }}
          title: "Add myfile.txt"
          body: "This PR adds myfile.txt"
          base: ${{ steps.get_branch.outputs.branch }}

      - name: Enable Pull Request Automerge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.generate_token.outputs.token }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

      - name: Merge Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            await github.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.cpr.outputs.pull-request-number }}
            })

      - name: Display Pull Request URL
        run: |
          echo "Pull Request URL: ${{ steps.cpr.outputs.pull-request-url }}"

  use-file:
    needs: create-and-pr
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find the latest generated file
        id: find_file
        run: |
          FILE=$(ls -t myfile-*.txt | head -n 1)
          echo "file_name=$FILE" >> $GITHUB_OUTPUT

      - name: Reference the file
        run: |
          if [ -f "${{ steps.find_file.outputs.file_name }}" ]; then
            echo "${{ steps.find_file.outputs.file_name }} exists. Contents:" && cat "${{ steps.find_file.outputs.file_name }}"
          else
            echo "File does not exist."
          fi
